name: Send Scrap Email Now

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-scrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Scrapped Articles & Reset Archive
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || secrets.TO_EMAIL }}
        run: python scripts/send_scrap_email.py

      - name: Commit reset archive
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/preferences.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: reset scrap archive after email"
          git pull --rebase origin main
          git push
