name: Daily News Generator

on:
  schedule:
    - cron: '0 21 * * *' # 매일 오전 6시 (한국시간 KST 기준)
  workflow_dispatch:

concurrency:
  group: daily-news-generator
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Generate Today's Newspaper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python scripts/generate_news.py

      - name: Commit and Push
        run: |
          git config user.name "Daily News Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Publish DAILY NEWS"
          git pull --rebase origin main || true
          git push
