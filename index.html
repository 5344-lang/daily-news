<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAILY NEWS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #faf7f0;
      --ink: #161616;
      --muted: #555;
      --border: #1a1a1a;
      --font-size: 16px;
    }
    body.eink {
      --bg: #ffffff;
      --paper: #ffffff;
      --ink: #000000;
      --muted: #222222;
      --border: #000000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Serif KR', Georgia, serif;
      font-size: var(--font-size);
      line-height: 1.8;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--paper);
      padding: 20px 24px 60px;
      min-height: 100vh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar button.active {
      background: var(--ink);
      color: var(--paper);
    }
    header {
      text-align: center;
      border-bottom: 4px double var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .masthead {
      font-family: 'Playfair Display', 'Noto Serif KR', serif;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 4px;
      margin: 0;
      line-height: 1.1;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-top: 10px;
      padding: 4px 2px;
      font-size: 12px;
      font-weight: 700;
    }
    .quote {
      font-size: 13px;
      font-style: italic;
      color: var(--muted);
      margin: 8px 0 0;
    }
    .front-grid {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 22px;
      margin-bottom: 24px;
    }
    @media (max-width: 700px) {
      .front-grid { grid-template-columns: 1fr; }
    }
    .cat-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid var(--border);
      padding: 1px 6px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .lead-title {
      font-size: 1.75em;
      font-weight: 900;
      line-height: 1.3;
      margin: 4px 0 12px;
    }
    .news-img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.25);
      border: 1px solid var(--border);
      margin: 10px 0 14px;
      display: block;
    }
    .article-body p {
      margin: 0 0 12px;
      text-align: justify;
      word-break: keep-all;
    }
    .dropcap::first-letter {
      float: left;
      font-size: 3.1em;
      line-height: 0.85;
      padding-right: 8px;
      padding-top: 4px;
      font-weight: 900;
    }
    .takeaway {
      margin-top: 14px;
      padding: 8px 12px;
      border-left: 3px solid var(--border);
      font-size: 0.92em;
      font-weight: 700;
    }
    .creator-box {
      border: 2px solid var(--border);
      padding: 14px;
      height: fit-content;
    }
    .creator-box h3 {
      margin: 6px 0 8px;
      font-size: 1.1em;
      line-height: 1.35;
    }
    .creator-box p {
      font-size: 0.88em;
      margin: 0 0 10px;
    }
    .creator-box a, .read-more {
      color: var(--ink);
      font-weight: 700;
      font-size: 0.85em;
      text-decoration: underline;
    }
    /* 일반 기사 영역 */
    .article-full-card {
      border-bottom: 1px solid var(--border);
      padding-bottom: 22px;
      margin-bottom: 24px;
    }
    .article-full-card h3 {
      margin: 4px 0 10px;
      font-size: 1.35em;
      line-height: 1.35;
    }
    .two-col-text {
      column-count: 2;
      column-gap: 24px;
      column-rule: 1px solid #ccc;
    }
    @media (max-width: 640px) {
      .two-col-text { column-count: 1; }
    }
    body.eink .two-col-text {
      column-count: 1;
    }
    .source-line {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    /* 오늘의 심리학 학습만화 섹션 */
    .psych-section {
      margin-top: 30px;
      border-top: 4px double var(--border);
      padding-top: 22px;
    }
    .comic-frame {
      border: 2px solid var(--border);
      background: #ffffff;
      margin: 14px 0 18px;
    }
    .comic-img {
      width: 100%;
      display: block;
      border-bottom: 2px solid var(--border);
    }
    body.eink .comic-img {
      filter: grayscale(100%) contrast(1.3);
    }
    .comic-caption {
      padding: 12px 16px;
      text-align: center;
      font-weight: 900;
      font-size: 0.98em;
      background: #ffffff;
      color: #000000;
    }
    .psych-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 640px) {
      .psych-body { grid-template-columns: 1fr; }
    }
    .psych-box {
      border: 1px solid var(--border);
      padding: 14px 16px;
    }
    .psych-box h4 {
      margin: 0 0 8px;
      font-size: 0.95em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }
    .psych-box p {
      margin: 0;
      font-size: 0.94em;
    }
    .eink-nav {
      display: none;
      justify-content: space-between;
      align-items: center;
      border-top: 2px solid var(--border);
      padding-top: 12px;
      margin-top: 20px;
    }
    body.eink .eink-nav { display: flex; }
    .eink-nav button {
      border: 2px solid var(--border);
      background: #fff;
      color: #000;
      padding: 8px 18px;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <div>
        <button id="btn-paper" class="active" onclick="setMode('paper')">신문지 모드</button>
        <button id="btn-eink" onclick="setMode('eink')">이북 모드 (페이지 넘김)</button>
      </div>
      <div>
        <button onclick="changeFont(-1)">가-</button>
        <button onclick="changeFont(1)">가+</button>
      </div>
    </div>

    <header>
      <h1 class="masthead" id="paper-name">DAILY NEWS</h1>
      <div class="meta-bar">
        <span id="paper-date">발행 준비 중</span>
        <span>PERSONAL MORNING EDITION</span>
      </div>
      <p class="quote" id="paper-quote"></p>
    </header>

    <main id="content">
      <p style="text-align:center; padding: 40px 0;">오늘의 신문을 불러오는 중입니다...</p>
    </main>

    <div class="eink-nav" id="eink-nav">
      <button onclick="movePage(-1)">◀ 이전 면</button>
      <span id="page-indicator">1 / 1 면</span>
      <button onclick="movePage(1)">다음 면 ▶</button>
    </div>
  </div>

  <script>
    let mode = localStorage.getItem('dn_mode') || 'paper';
    let fontSize = parseInt(localStorage.getItem('dn_font') || '16', 10);
    let currentPage = 0;
    let pages = [];

    document.documentElement.style.setProperty('--font-size', fontSize + 'px');

    function changeFont(delta) {
      fontSize = Math.min(24, Math.max(13, fontSize + delta));
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
      localStorage.setItem('dn_font', fontSize);
    }

    function setMode(newMode) {
      mode = newMode;
      localStorage.setItem('dn_mode', mode);
      document.body.classList.toggle('eink', mode === 'eink');
      document.getElementById('btn-paper').classList.toggle('active', mode === 'paper');
      document.getElementById('btn-eink').classList.toggle('active', mode === 'eink');
      applyPagination();
    }

    function applyPagination() {
      pages = Array.from(document.querySelectorAll('.paper-page'));
      if (mode === 'eink' && pages.length > 0) {
        currentPage = Math.min(currentPage, pages.length - 1);
        pages.forEach((el, idx) => el.classList.toggle('hidden', idx !== currentPage));
        document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${pages.length} 면`;
        window.scrollTo(0, 0);
      } else {
        pages.forEach(el => el.classList.remove('hidden'));
      }
    }

    function movePage(delta) {
      const next = currentPage + delta;
      if (next >= 0 && next < pages.length) {
        currentPage = next;
        applyPagination();
      }
    }

    // 이북리더기 물리 키(좌우 방향키) 페이지 넘김 지원
    document.addEventListener('keydown', (e) => {
      if (mode !== 'eink') return;
      if (e.key === 'ArrowRight') movePage(1);
      else if (e.key === 'ArrowLeft') movePage(-1);
    });

    function imgTag(src) {
      if (!src) return '';
      return `<img class="news-img" src="${src}" alt="기사 사진" onerror="this.style.display='none'" />`;
    }

    function formatParagraphs(text, useDropcap = false) {
      if (!text) return '';
      const paras = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
      return paras.map((p, idx) =>
        `<p class="${useDropcap && idx === 0 ? 'dropcap' : ''}">${p}</p>`
      ).join('');
    }

    function renderPsychColumn(psych) {
      if (!psych || !psych.title) return '';
      const comicImg = psych.image
        ? `<img class="comic-img" src="${psych.image}?t=${Date.now()}" alt="${psych.concept_name}" onerror="this.style.display='none'" />`
        : '';
      return `
        <section class="paper-page psych-section">
          <span class="cat-tag">오늘의 심리학 도감 · ${psych.concept_name || 'PSYCHOLOGY'}</span>
          <h2 style="margin:4px 0 8px; font-size:1.5em;">${psych.title}</h2>
          <div class="comic-frame">
            ${comicImg}
            <div class="comic-caption">${psych.caption || ''}</div>
          </div>
          <div class="psych-body">
            <div class="psych-box">
              <h4>핵심 개념</h4>
              <p>${psych.summary || ''}</p>
            </div>
            <div class="psych-box">
              <h4>실험 · 일상 사례</h4>
              <p>${psych.real_case || ''}</p>
            </div>
          </div>
        </section>`;
    }

    async function loadPaper() {
      try {
        const [edRes, colRes] = await Promise.all([
          fetch('./data/today.json?t=' + Date.now()),
          fetch('./creator_column.json?t=' + Date.now()).catch(() => null)
        ]);
        if (!edRes.ok) throw new Error('아직 발행된 신문이 없습니다. GitHub Actions에서 수동 실행을 한 번 돌려주세요.');
        const ed = await edRes.json();
        const col = colRes && colRes.ok ? await colRes.json() : null;

        document.getElementById('paper-name').textContent = ed.paper_name || 'DAILY NEWS';
        document.getElementById('paper-date').textContent = ed.date_kr || ed.date;
        document.getElementById('paper-quote').textContent = ed.edition_quote || '';

        const lead = ed.lead_story;
        const leadBody = lead.full_article || lead.summary || '';
        const colUrl = col && col.url ? (col.url.startsWith('http') ? col.url : 'https://' + col.url) : '#';
        const colHtml = col ? `
          <aside class="creator-box">
            <span class="cat-tag">${col.badge || 'COLUMN'}</span>
            <h3>${col.title}</h3>
            <p>${col.summary}</p>
            <a href="${colUrl}" target="_blank">${col.link_text || '읽어보기 →'}</a>
          </aside>` : '';

        const page1 = `
          <section class="paper-page front-grid">
            <article>
              <span class="cat-tag">${lead.category}</span>
              <h2 class="lead-title">${lead.title}</h2>
              ${imgTag(lead.image)}
              <div class="article-body">${formatParagraphs(leadBody, true)}</div>
              ${lead.takeaway ? `<div class="takeaway">핵심: ${lead.takeaway}</div>` : ''}
              <div class="source-line">${lead.source} · <a class="read-more" href="${lead.url}" target="_blank">원문 출처</a></div>
            </article>
            ${colHtml}
          </section>`;

        // 일반 기사는 1면당 1건씩 전체 본문 + 큰 사진으로 배치
        const articlePages = ed.articles.map(a => {
          const body = a.full_article || a.summary || '';
          return `
            <section class="paper-page article-full-card">
              <span class="cat-tag">${a.category}</span>
              <h3>${a.title}</h3>
              ${imgTag(a.image)}
              <div class="article-body two-col-text">${formatParagraphs(body, false)}</div>
              <div class="source-line">${a.source} · <a class="read-more" href="${a.url}" target="_blank">원문 출처</a></div>
            </section>`;
        }).join('');

        document.getElementById('content').innerHTML = page1 + articlePages + renderPsychColumn(ed.psych_column);
        setMode(mode);
      } catch (err) {
        document.getElementById('content').innerHTML = `<p style="text-align:center; padding:40px 0;">${err.message}</p>`;
      }
    }

    loadPaper();
  </script>
</body>
</html>
