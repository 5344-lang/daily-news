<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DAILY NEWS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #faf7f0;
      --ink: #161616;
      --muted: #555;
      --border: #1a1a1a;
      --font-size: 16px;
      --line-height: 28px;
    }
    body.eink {
      --bg: #ffffff;
      --paper: #ffffff;
      --ink: #000000;
      --muted: #222222;
      --border: #000000;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Serif KR', Georgia, serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--paper);
      padding: 18px 22px 60px;
      min-height: 100vh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    body.eink .container {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      padding: 10px 18px 10px;
      display: flex;
      flex-direction: column;
      border: none;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar-group {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .toolbar button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 4px 9px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar button.active {
      background: var(--ink);
      color: var(--paper);
    }
    .eink-viewport {
      width: 100%;
    }
    body.eink .eink-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    body.eink #reader-track {
      column-fill: auto;
      will-change: transform;
    }
    header {
      text-align: center;
      border-bottom: 4px double var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
      break-inside: avoid;
    }
    .masthead {
      font-family: 'Playfair Display', 'Noto Serif KR', serif;
      font-size: clamp(2rem, 5.5vw, 3.3rem);
      font-weight: 900;
      letter-spacing: 4px;
      margin: 0;
      line-height: 1.1;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-top: 8px;
      padding: 3px 2px;
      font-size: 12px;
      font-weight: 700;
    }
    .briefing-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding: 5px 2px;
      font-size: 12.5px;
      line-height: 1.45;
      text-align: left;
    }
    .briefing-bar span {
      word-break: break-all;
    }
    .quote {
      font-size: 13px;
      font-style: italic;
      color: var(--muted);
      margin: 6px 0 0;
      line-height: 1.5;
    }
    .front-section {
      border-bottom: 2px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }
    .cat-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid var(--border);
      padding: 1px 6px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .cat-tag.dark {
      background: var(--ink);
      color: var(--paper);
    }
    h2, h3, h4 {
      break-after: avoid;
      page-break-after: avoid;
    }
    .lead-title {
      font-size: 1.55em;
      font-weight: 900;
      line-height: 1.32;
      margin: 4px 0 10px;
    }
    .news-img {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.22);
      border: 1px solid var(--border);
      margin: 8px 0 12px;
      display: block;
      break-inside: avoid;
    }
    .article-body p {
      margin: 0 0 11px;
      text-align: justify;
      word-break: break-all;
      overflow-wrap: break-word;
      orphans: 2;
      widows: 2;
    }
    .dropcap::first-letter {
      float: left;
      font-size: 2.8em;
      line-height: 0.85;
      padding-right: 7px;
      padding-top: 3px;
      font-weight: 900;
    }
    .takeaway {
      margin: 12px 0;
      padding: 8px 12px;
      border-left: 3px solid var(--border);
      font-size: 0.92em;
      font-weight: 700;
      break-inside: avoid;
    }
    .read-more {
      color: var(--ink);
      font-weight: 700;
      font-size: 0.85em;
      text-decoration: underline;
    }
    .article-section {
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }
    .article-section h3 {
      margin: 4px 0 10px;
      font-size: 1.3em;
      line-height: 1.35;
    }
    .two-col-text {
      column-count: 2;
      column-gap: 24px;
      column-rule: 1px solid #ccc;
    }
    @media (max-width: 640px) {
      .two-col-text { column-count: 1; }
    }
    body.eink .two-col-text {
      column-count: 1;
      column-rule: none;
    }
    .source-line {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      break-inside: avoid;
    }
    .special-section {
      border-top: 4px double var(--border);
      padding-top: 18px;
      margin-top: 24px;
    }
    .special-meta {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .eink-nav {
      display: none;
      justify-content: space-between;
      align-items: center;
      border-top: 2px solid var(--border);
      padding-top: 8px;
      margin-top: 6px;
      flex-shrink: 0;
    }
    body.eink .eink-nav { display: flex; }
    .eink-nav button {
      border: 1.5px solid var(--border);
      background: #fff;
      color: #000;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .eink-nav .page-jump-btn {
      border: 1px dashed var(--border);
      padding: 5px 14px;
      font-weight: 700;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #faf7f0;
      color: #111;
      border: 2px solid #111;
      max-width: 620px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .modal.compact {
      max-width: 380px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #111;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .modal-header h3 { margin: 0; font-size: 1.1em; }
    .modal-sec {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px dashed #999;
    }
    .modal-sec h4 { margin: 0 0 8px; font-size: 0.95em; }
    .row-item {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }
    .row-item input[type="text"], .row-item input[type="password"], .row-item input[type="number"] {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #333;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      min-width: 0;
    }
    .row-item .small-input { flex: 0 0 34%; }
    .btn-sm {
      padding: 5px 9px;
      border: 1px solid #111;
      background: #fff;
      color: #111;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      white-space: nowrap;
    }
    .btn-primary {
      background: #111;
      color: #fff;
      border: 1px solid #111;
      padding: 8px 14px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-outline {
      background: #fff;
      color: #111;
      border: 1px solid #111;
      padding: 8px 14px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .help-text {
      font-size: 12px;
      color: #555;
      margin: 4px 0 8px;
      line-height: 1.5;
    }
    .page-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 12px;
    }
    .page-num-btn {
      padding: 8px 0;
      border: 1px solid #111;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .page-num-btn.current {
      background: #111;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <div class="toolbar-group">
        <button id="btn-paper" class="active" onclick="setMode('paper')">신문지 모드</button>
        <button id="btn-eink" onclick="setMode('eink')">이북 모드</button>
      </div>
      <div class="toolbar-group">
        <button onclick="changeFont(-1)">가-</button>
        <button onclick="changeFont(1)">가+</button>
        <button onclick="openSettings()">⚙ 설정</button>
      </div>
    </div>

    <div class="eink-viewport" id="eink-viewport" onclick="handleViewportTap(event)">
      <div id="reader-track">
        <header>
          <h1 class="masthead" id="paper-name">DAILY NEWS</h1>
          <div class="meta-bar">
            <span id="paper-date">발행 준비 중</span>
            <span>PERSONAL MORNING EDITION</span>
          </div>
          <div class="briefing-bar" id="briefing-bar"></div>
          <p class="quote" id="paper-quote"></p>
        </header>

        <main id="content">
          <p style="text-align:center; padding: 40px 0;">오늘의 신문을 불러오는 중입니다...</p>
        </main>
      </div>
    </div>

    <div class="eink-nav" id="eink-nav">
      <button onclick="movePage(-1)">◀ 이전</button>
      <button class="page-jump-btn" id="page-indicator" onclick="openPageJump()">1 / 1</button>
      <button onclick="movePage(1)">다음 ▶</button>
    </div>
  </div>

  <!-- 페이지 바로 이동 모달 -->
  <div class="modal-backdrop" id="jump-modal" onclick="if(event.target===this) closePageJump()">
    <div class="modal compact">
      <div class="modal-header">
        <h3>페이지 이동</h3>
        <button class="btn-sm" onclick="closePageJump()">닫기 ✕</button>
      </div>
      <div class="row-item">
        <input type="number" id="jump-input" min="1" placeholder="페이지 번호 입력" onkeydown="if(event.key==='Enter') jumpToInputPage()" />
        <button class="btn-primary" onclick="jumpToInputPage()">이동</button>
      </div>
      <div class="page-grid" id="page-grid"></div>
    </div>
  </div>

  <!-- 신문 내 설정 모달 -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚙ 신문 관심사 & 구독 설정</h3>
        <button class="btn-sm" onclick="closeSettings()">닫기 ✕</button>
      </div>

      <div class="modal-sec">
        <h4>1. 기본 날씨 지역 (이북·메일용)</h4>
        <div class="row-item">
          <input type="text" id="cfg-weather-city" placeholder="도시명 (예: 대구, 서울, 부산)" />
        </div>
        <p class="help-text">스마트폰·PC 브라우저에서는 위치 권한 허용 시 현재 위치 날씨가 자동 반영됩니다.</p>
      </div>

      <div class="modal-sec">
        <h4>2. 관심 뉴스 키워드</h4>
        <div id="cfg-categories"></div>
        <button class="btn-sm" onclick="addCategoryRow()">+ 뉴스 카테고리 추가</button>
      </div>

      <div class="modal-sec">
        <h4>3. 최신 심리학 실험 논문 피드</h4>
        <div id="cfg-research"></div>
        <button class="btn-sm" onclick="addResearchRow()">+ 연구 RSS 추가</button>
      </div>

      <div class="modal-sec">
        <h4>4. 구독 블로그 (원문 전체 수록)</h4>
        <p class="help-text">네이버 블로그는 아이디(예: <code>talk_sim_mind</code>)나 주소만 넣어도 자동 변환됩니다.</p>
        <div id="cfg-blogs"></div>
        <button class="btn-sm" onclick="addBlogRow()">+ 블로그 추가</button>
      </div>

      <div class="modal-sec">
        <h4>5. GitHub 저장소 연동 (이 기기에만 저장)</h4>
        <div class="row-item">
          <input type="text" id="gh-repo" placeholder="아이디/저장소 (예: 5344-lang/daily-news)" />
        </div>
        <div class="row-item">
          <input type="password" id="gh-token" placeholder="GitHub Personal Access Token" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-outline" onclick="saveConfigToGitHub(false)">설정만 저장</button>
        <button class="btn-primary" onclick="saveConfigToGitHub(true)">저장 & 지금 바로 신문 다시 뽑기</button>
      </div>
      <div class="status-msg" id="settings-status"></div>
    </div>
  </div>

  <script>
    const COLUMN_GAP = 32;
    const WMO_DESC = {
      0: '맑음', 1: '대체로 맑음', 2: '구름 조금', 3: '흐림',
      45: '안개', 48: '짙은 안개',
      51: '가벼운 이슬비', 53: '이슬비', 55: '강한 이슬비',
      61: '약한 비', 63: '비', 65: '강한 비',
      71: '약한 눈', 73: '눈', 75: '강한 눈',
      80: '소나기', 81: '소나기', 82: '강한 소나기',
      95: '뇌우', 96: '우박 동반 뇌우', 99: '강한 뇌우'
    };

    let mode = localStorage.getItem('dn_mode') || 'paper';
    let fontSize = parseInt(localStorage.getItem('dn_font') || '16', 10);
    let currentPage = 0;
    let totalPages = 1;
    let loadedConfig = null;

    function applyTypography() {
      const lh = Math.round(fontSize * 1.75);
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
      document.documentElement.style.setProperty('--line-height', lh + 'px');
    }
    applyTypography();

    function changeFont(delta) {
      fontSize = Math.min(24, Math.max(13, fontSize + delta));
      localStorage.setItem('dn_font', fontSize);
      applyTypography();
      if (mode === 'eink') setTimeout(updateEinkLayout, 60);
    }

    function setMode(newMode) {
      mode = newMode;
      localStorage.setItem('dn_mode', mode);
      document.body.classList.toggle('eink', mode === 'eink');
      document.getElementById('btn-paper').classList.toggle('active', mode === 'paper');
      document.getElementById('btn-eink').classList.toggle('active', mode === 'eink');

      const track = document.getElementById('reader-track');
      if (mode === 'eink') {
        currentPage = 0;
        requestAnimationFrame(() => updateEinkLayout());
      } else {
        track.style.height = '';
        track.style.width = '';
        track.style.columnWidth = '';
        track.style.columnGap = '';
        track.style.transform = '';
        document.querySelectorAll('.news-img').forEach(img => img.style.maxHeight = '');
      }
    }

    function updateEinkLayout() {
      if (mode !== 'eink') return;
      const vp = document.getElementById('eink-viewport');
      const track = document.getElementById('reader-track');
      const vw = vp.clientWidth;
      const vh = vp.clientHeight;
      if (!vw || !vh) return;

      const safeHeight = Math.max(180, vh - 22);
      const maxImgH = Math.max(120, Math.floor(safeHeight * 0.34));
      document.querySelectorAll('.news-img').forEach(img => {
        img.style.maxHeight = maxImgH + 'px';
      });

      track.style.height = safeHeight + 'px';
      track.style.width = vw + 'px';
      track.style.columnWidth = vw + 'px';
      track.style.columnGap = COLUMN_GAP + 'px';

      const step = vw + COLUMN_GAP;
      totalPages = Math.max(1, Math.ceil((track.scrollWidth + COLUMN_GAP - 4) / step));
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      if (currentPage < 0) currentPage = 0;

      track.style.transform = `translateX(-${currentPage * step}px)`;
      document.getElementById('page-indicator').textContent = `${currentPage + 1} / ${totalPages}`;
    }

    function goToPage(pageIdx) {
      if (mode !== 'eink') return;
      currentPage = Math.max(0, Math.min(totalPages - 1, pageIdx));
      updateEinkLayout();
    }

    function movePage(delta) {
      goToPage(currentPage + delta);
    }

    function openPageJump() {
      if (mode !== 'eink') return;
      const input = document.getElementById('jump-input');
      input.max = totalPages;
      input.value = currentPage + 1;

      const grid = document.getElementById('page-grid');
      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        const cls = (i - 1 === currentPage) ? 'page-num-btn current' : 'page-num-btn';
        html += `<button class="${cls}" onclick="goToPage(${i - 1}); closePageJump();">${i}</button>`;
      }
      grid.innerHTML = html;
      document.getElementById('jump-modal').classList.add('open');
    }

    function closePageJump() {
      document.getElementById('jump-modal').classList.remove('open');
    }

    function jumpToInputPage() {
      const val = parseInt(document.getElementById('jump-input').value, 10);
      if (!isNaN(val) && val >= 1 && val <= totalPages) {
        goToPage(val - 1);
        closePageJump();
      }
    }

    function handleViewportTap(e) {
      if (mode !== 'eink') return;
      if (e.target.closest('a, button, input')) return;
      const rect = document.getElementById('eink-viewport').getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width * 0.33) movePage(-1);
      else if (x > rect.width * 0.67) movePage(1);
    }

    document.addEventListener('keydown', (e) => {
      if (document.querySelector('.modal-backdrop.open')) return;
      if (mode !== 'eink') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        movePage(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        movePage(-1);
      }
    });

    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => {
        if (mode === 'eink') updateEinkLayout();
      });
      ro.observe(document.getElementById('eink-viewport'));
    }

    // 현재 기기 GPS 위치 기반 실시간 날씨 자동 갱신 (지원 안 되는 기기는 기본 대구 날씨 유지)
    function updateLiveLocationWeather() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const lat = pos.coords.latitude.toFixed(4);
            const lon = pos.coords.longitude.toFixed(4);
            const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1`;
            const gUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`;

            const [wRes, gRes] = await Promise.all([
              fetch(wUrl),
              fetch(gUrl).catch(() => null)
            ]);
            if (!wRes.ok) return;
            const wData = await wRes.json();
            const gData = gRes && gRes.ok ? await gRes.json() : {};

            const place = (gData.locality || gData.city || gData.principalSubdivision || '현위치')
              .replace(/광역시|특별시|특별자치시|특별자치도/g, '').trim();
            const daily = wData.daily || {};
            const cur = wData.current || {};
            const code = cur.weathercode ?? (daily.weathercode ? daily.weathercode[0] : 0);
            const desc = WMO_DESC[code] || '흐림';
            const tNow = cur.temperature_2m !== undefined ? `현재 ${Math.round(cur.temperature_2m)}° · ` : '';
            const tMin = Math.round((daily.temperature_2m_min || [0])[0]);
            const tMax = Math.round((daily.temperature_2m_max || [0])[0]);
            const rain = (daily.precipitation_probability_max || [0])[0];

            const slot = document.getElementById('weather-slot');
            if (slot) {
              slot.innerHTML = `<b>📍 ${place} ${desc} ${tNow}${tMin}°/${tMax}° (강수 ${rain}%)</b>`;
              if (mode === 'eink') updateEinkLayout();
            }
          } catch (e) {
            // 실패 시 기본(대구) 날씨 그대로 유지
          }
        },
        () => {},
        { timeout: 6000, maximumAge: 600000 }
      );
    }

    function imgTag(src) {
      if (!src) return '';
      const bust = src.startsWith('./') ? `${src}?t=${Date.now()}` : src;
      return `<img class="news-img" src="${bust}" referrerpolicy="no-referrer" alt="기사 사진" onload="updateEinkLayout()" onerror="this.style.display='none'; updateEinkLayout();" />`;
    }

    function formatParagraphs(text, useDropcap = false) {
      if (!text) return '';
      const paras = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
      return paras.map((p, idx) =>
        `<p class="${useDropcap && idx === 0 ? 'dropcap' : ''}">${p}</p>`
      ).join('');
    }

    function renderResearch(r) {
      if (!r || !r.title) return '';
      return `
        <section class="special-section">
          <span class="cat-tag dark">오늘의 심리 실험 리포트 · ${r.source_name || 'RESEARCH'}</span>
          <h3 style="margin:6px 0 4px; font-size:1.4em; line-height:1.35;">${r.title}</h3>
          <p class="special-meta">${r.journal_info || ''}</p>
          ${imgTag(r.image)}
          <div class="article-body">${formatParagraphs(r.full_article, true)}</div>
          ${r.takeaway ? `<div class="takeaway">핵심: ${r.takeaway}</div>` : ''}
          <div class="source-line"><a class="read-more" href="${r.url}" target="_blank">원문 연구 기사 보기</a></div>
        </section>`;
    }

    function renderBlogs(blogs) {
      if (!blogs || blogs.length === 0) return '';
      return blogs.map(b => `
        <section class="special-section">
          <span class="cat-tag">구독 아티클 · ${b.blog_name || 'BLOG'}</span>
          <h3 style="margin:6px 0 8px; font-size:1.35em; line-height:1.35;">${b.title}</h3>
          ${imgTag(b.image)}
          <div class="article-body">${formatParagraphs(b.full_article, false)}</div>
          <div class="source-line">${b.blog_name}${b.published ? ' · ' + b.published : ''} · <a class="read-more" href="${b.url}" target="_blank">블로그 원문 보기</a></div>
        </section>`).join('');
    }

    async function loadPaper() {
      try {
        const edRes = await fetch('./data/today.json?t=' + Date.now());
        if (!edRes.ok) throw new Error('아직 발행된 신문이 없습니다. GitHub Actions에서 수동 실행을 한 번 돌려주세요.');
        const ed = await edRes.json();

        document.getElementById('paper-name').textContent = ed.paper_name || 'DAILY NEWS';
        document.getElementById('paper-date').textContent = ed.date_kr || ed.date;
        document.getElementById('paper-quote').textContent = ed.edition_quote || '';

        const weatherText = ed.weather ? `☀ ${ed.weather}` : '☀ 날씨 불러오는 중...';
        const scheduleText = ed.schedule ? `📅 ${ed.schedule}` : '📅 일정 미연동';
        const briefingEl = document.getElementById('briefing-bar');
        briefingEl.innerHTML = `<span id="weather-slot"><b>${weatherText}</b></span><span>${scheduleText}</span>`;
        briefingEl.style.display = 'flex';

        const lead = ed.lead_story;
        const leadBody = lead.full_article || lead.summary || '';
        const frontHtml = `
          <section class="front-section">
            <article>
              <span class="cat-tag">${lead.category}</span>
              <h2 class="lead-title">${lead.title}</h2>
              ${imgTag(lead.image)}
              <div class="article-body">${formatParagraphs(leadBody, true)}</div>
              ${lead.takeaway ? `<div class="takeaway">핵심: ${lead.takeaway}</div>` : ''}
              <div class="source-line">${lead.source} · <a class="read-more" href="${lead.url}" target="_blank">원문 출처</a></div>
            </article>
          </section>`;

        const articlesHtml = (ed.articles || []).map(a => {
          const body = a.full_article || a.summary || '';
          return `
            <section class="article-section">
              <span class="cat-tag">${a.category}</span>
              <h3>${a.title}</h3>
              ${imgTag(a.image)}
              <div class="article-body two-col-text">${formatParagraphs(body, false)}</div>
              <div class="source-line">${a.source} · <a class="read-more" href="${a.url}" target="_blank">원문 출처</a></div>
            </section>`;
        }).join('');

        document.getElementById('content').innerHTML =
          frontHtml + articlesHtml + renderResearch(ed.research_report) + renderBlogs(ed.blog_articles);

        setMode(mode);
        updateLiveLocationWeather();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => updateEinkLayout());
        }
      } catch (err) {
        document.getElementById('content').innerHTML = `<p style="text-align:center; padding:40px 0;">${err.message}</p>`;
      }
    }

    // ===== 설정 모달 =====
    function inferRepo() {
      const saved = localStorage.getItem('dn_gh_repo');
      if (saved) return saved;
      if (location.hostname.endsWith('github.io')) {
        const owner = location.hostname.split('.')[0];
        const repo = location.pathname.split('/').filter(Boolean)[0] || 'daily-news';
        return `${owner}/${repo}`;
      }
      return '5344-lang/daily-news';
    }

    function escapeAttr(s) {
      return String(s || '').replace(/"/g, '&quot;');
    }

    function makeRowHtml(type, name = '', val = '', enabled = true) {
      const ph1 = type === 'cat' ? '카테고리명' : '이름';
      const ph2 = type === 'cat' ? '검색 키워드 (OR로 연결)' : 'RSS 주소 또는 네이버 블로그 아이디';
      const chk = type === 'cat' ? '' : `<input type="checkbox" class="inp-en" ${enabled ? 'checked' : ''} />`;
      return `
        <div class="row-item">
          ${chk}
          <input type="text" class="small-input inp-name" value="${escapeAttr(name)}" placeholder="${ph1}" />
          <input type="text" class="inp-val" value="${escapeAttr(val)}" placeholder="${ph2}" />
          <button class="btn-sm" onclick="this.parentElement.remove()">삭제</button>
        </div>`;
    }

    function addCategoryRow(n = '', q = '') {
      document.getElementById('cfg-categories').insertAdjacentHTML('beforeend', makeRowHtml('cat', n, q));
    }
    function addResearchRow(n = '', u = '', en = true) {
      document.getElementById('cfg-research').insertAdjacentHTML('beforeend', makeRowHtml('res', n, u, en));
    }
    function addBlogRow(n = '', u = '', en = true) {
      document.getElementById('cfg-blogs').insertAdjacentHTML('beforeend', makeRowHtml('blog', n, u, en));
    }

    async function openSettings() {
      document.getElementById('settings-status').textContent = '';
      document.getElementById('gh-repo').value = inferRepo();
      document.getElementById('gh-token').value = localStorage.getItem('dn_gh_token') || '';

      try {
        const res = await fetch('./config.json?t=' + Date.now());
        loadedConfig = res.ok ? await res.json() : {};
      } catch {
        loadedConfig = {};
      }

      document.getElementById('cfg-weather-city').value = loadedConfig.weather_city || '대구';

      document.getElementById('cfg-categories').innerHTML = '';
      (loadedConfig.categories || []).forEach(c => addCategoryRow(c.name, c.query));

      document.getElementById('cfg-research').innerHTML = '';
      (loadedConfig.research_feeds || [
        { name: 'ScienceDaily 심리연구', url: 'https://www.sciencedaily.com/rss/mind_brain/psychology.xml', enabled: true },
        { name: 'PsyPost 심리실험', url: 'https://www.psypost.org/feed/', enabled: true }
      ]).forEach(r => addResearchRow(r.name, r.url, r.enabled !== false));

      document.getElementById('cfg-blogs').innerHTML = '';
      (loadedConfig.blogs || [
        { name: '똑심마인드 블로그', url: 'https://rss.blog.naver.com/talk_sim_mind.xml', enabled: true }
      ]).forEach(b => addBlogRow(b.name, b.url, b.enabled !== false));

      document.getElementById('settings-modal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.remove('open');
    }

    function normalizeBlogUrl(raw) {
      const u = raw.trim();
      if (!u) return '';
      if (u.includes('rss.blog.naver.com')) return u;
      const m = u.match(/blog\.naver\.com\/([a-zA-Z0-9_-]+)/);
      if (m) return `https://rss.blog.naver.com/${m[1]}.xml`;
      if (!u.startsWith('http') && /^[a-zA-Z0-9_-]+$/.test(u)) return `https://rss.blog.naver.com/${u}.xml`;
      return u;
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin);
    }

    async function saveConfigToGitHub(triggerRun) {
      const statusEl = document.getElementById('settings-status');
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();

      if (!repo || !token) {
        statusEl.textContent = '⚠ GitHub 저장소 이름과 토큰을 먼저 입력해 주세요.';
        return;
      }
      localStorage.setItem('dn_gh_repo', repo);
      localStorage.setItem('dn_gh_token', token);

      const categories = Array.from(document.querySelectorAll('#cfg-categories .row-item')).map(row => ({
        name: row.querySelector('.inp-name').value.trim(),
        query: row.querySelector('.inp-val').value.trim(),
      })).filter(c => c.name && c.query);

      const research_feeds = Array.from(document.querySelectorAll('#cfg-research .row-item')).map(row => ({
        name: row.querySelector('.inp-name').value.trim(),
        url: row.querySelector('.inp-val').value.trim(),
        enabled: row.querySelector('.inp-en').checked,
      })).filter(r => r.name && r.url);

      const blogs = Array.from(document.querySelectorAll('#cfg-blogs .row-item')).map(row => ({
        name: row.querySelector('.inp-name').value.trim(),
        url: normalizeBlogUrl(row.querySelector('.inp-val').value),
        enabled: row.querySelector('.inp-en').checked,
      })).filter(b => b.name && b.url);

      const newConfig = {
        paper_name: (loadedConfig && loadedConfig.paper_name) || 'DAILY NEWS',
        site_url: (loadedConfig && loadedConfig.site_url) || location.href.split('?')[0],
        weather_city: document.getElementById('cfg-weather-city').value.trim() || '대구',
        categories,
        research_feeds,
        blogs,
      };

      const headers = {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json',
      };

      try {
        statusEl.textContent = 'GitHub에 설정 저장 중...';
        const apiUrl = `https://api.github.com/repos/${repo}/contents/config.json`;
        const getRes = await fetch(apiUrl, { headers });
        let sha = undefined;
        if (getRes.ok) {
          const cur = await getRes.json();
          sha = cur.sha;
        }

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers,
          body: JSON.stringify({
            message: 'Update config.json from Daily News web UI',
            content: utf8ToBase64(JSON.stringify(newConfig, null, 2)),
            sha,
          }),
        });
        if (!putRes.ok) throw new Error('config.json 저장 실패 (토큰의 Contents 쓰기 권한 확인)');

        if (triggerRun) {
          statusEl.textContent = '저장 완료! 새 신문 발행을 요청하는 중...';
          const runRes = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/daily.yml/dispatches`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ ref: 'main' }),
          });
          if (!runRes.ok) throw new Error('설정은 저장되었으나 즉시 실행 실패 (토큰의 Actions 쓰기 권한 확인)');
          statusEl.textContent = '✅ 저장 & 재발행 요청 완료! 약 1분 뒤 새로고침해 주세요.';
        } else {
          statusEl.textContent = '✅ 설정이 저장되었습니다. 내일 오전 6시부터 반영됩니다.';
        }
      } catch (err) {
        statusEl.textContent = '❌ ' + err.message;
      }
    }

    loadPaper();
  </script>
</body>
</html>
